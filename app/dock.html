<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; object-src 'none'; base-uri 'none'">
  <title>Pebblebit Assistant</title>
  <link rel="stylesheet" href="css/dock.css">
  <script type="module" src="js/dock.js"></script>
</head>
<body>
  <main class="assistant">
    <header><h1>Pebblebit</h1><button id="hide" type="button" aria-label="Hide assistant">×</button></header>
    <div class="pet">
      <canvas id="pet" width="96" height="64" aria-hidden="true"></canvas>
      <div><strong id="name">Pebblebit</strong><p id="state">Connecting to the app…</p><p id="focus-clock" role="timer" hidden></p></div>
    </div>
    <p id="message" role="status"></p>
    <footer><button id="open" type="button">Open Pebblebit</button><button id="focus-pause" type="button" hidden>Pause</button></footer>
  </main>
</body>
</html>
